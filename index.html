<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Background - Generator</title>
    <link rel="shortcut icon" href="./src/images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/responsivo.css">
</head>
<body>
    <header>
        <h1>Fundo mágico</h1>
        <p class="subtitle">Transforme suas ideias em backgrounds incríveis com o poder da IA. Descreva o que você imagina e veja a magia acontecer.</p>
    </header>

    <main>
        <section class="card main-card">
            <h2>Descreva o background que você deseja</h2>
            <form class="form-group">
                <textarea id="description" placeholder="Ex: Crie um background com um gradiente do lilás para o roxo escuro"></textarea>

                <button id="generate-btn" class="btn">
                    <span>Gerar background personalizado</span>
                </button>
            </form>
        </section>

        <section id="bg-preview" class="preview-card"></section>

        <section id="code-output" class="code-preview">
            <div class="card code-card">
                <h3 class="code-title">Código HTML</h3>
                <pre id="html-code" class="code-block">printf("Hello, world!!")</pre>
            </div>
            <div class="card code-card">
                <h3 class="code-title">Código CSS</h3>
                <pre id="css-code" class="code-block">printf("Hello, world!!")</pre>
            </div>
        </section>
    </main>

    <footer></footer>
</body>
</html>
